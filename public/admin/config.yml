# Web editor for the catalogue (Sveltia CMS). Open isaacandersonart.com/admin/ and sign in with GitHub.
# Every save is a commit to the branch below; Cloudflare rebuilds the site from it.
backend:
  name: github
  repo: yitzhach/IA-ART-Claude-Code
  branch: v2 # change to main once V2 is merged and live

media_folder: src/assets/uploads
public_folder: /src/assets/uploads

collections:
  - name: works
    label: Works
    label_singular: Work
    description: One entry per artwork. Photos are stored next to each work; the first is the cover.
    folder: src/content/works
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} · {{status}}'
    sortable_fields: [order, title, status]
    fields:
      - { label: Title, name: title, widget: string, required: false, hint: Leave empty if the piece is untitled. }
      - label: Collections
        name: collections
        widget: select
        multiple: true
        options:
          - { label: Abstract, value: abstract }
          - { label: Figurative, value: figurative }
          - { label: Sculptural, value: sculptural }
      - label: Status
        name: status
        widget: select
        default: inquire
        options:
          - { label: Available — for sale now, value: available }
          - { label: Reserved — on hold for a buyer, value: reserved }
          - { label: Sold, value: sold }
          - { label: Private commission, value: commission }
          - { label: Not confirmed — visitors ask, value: inquire }
      - { label: Price (US dollars), name: price, widget: number, value_type: int, required: false, hint: Leave empty to show "Price on request". }
      - { label: Buy now link, name: buyLink, widget: string, required: false, hint: Optional Stripe Payment Link. Adds a Buy now button when the work is available. }
      - { label: Width (inches), name: width, widget: number, value_type: float, required: false }
      - { label: Height (inches), name: height, widget: number, value_type: float, required: false }
      - { label: Depth (inches), name: depth, widget: number, value_type: float, required: false }
      - { label: Medium, name: medium, widget: string, required: false, hint: e.g. Cement, plaster and pigment on panel }
      - { label: Year, name: year, widget: number, value_type: int, required: false }
      - label: Photos
        name: images
        widget: list
        min: 1
        field: { label: Photo, name: image, widget: image }
      - { label: Description (what it looks like), name: alt, widget: text, required: false, hint: Read aloud to blind visitors and used by Ask AI to find works by colour or motif. }
      - { label: Show on home page, name: featured, widget: boolean, default: false, required: false }
      - { label: Order, name: order, widget: number, value_type: int, default: 1000, hint: Lower numbers come first. }
      - { label: Statement, name: body, widget: markdown, required: false, hint: A sentence or two about the piece. }
      - { label: Old v1 references, name: v1, widget: list, required: false, hint: Reference only — leave as is. }
